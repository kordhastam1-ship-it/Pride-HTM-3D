<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PRIDE HTM 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:tahoma}
canvas{display:block}

#hud{
position:fixed;top:12px;left:12px;right:12px;
display:flex;justify-content:space-between;
pointer-events:none;color:white
}

.box{
background:#071522dd;
padding:12px 17px;
border:1px solid #ffffff44;
border-radius:15px;
backdrop-filter:blur(10px);
}

#speed{font-size:28px;color:#00eaff;font-weight:bold}

#controls{
position:fixed;bottom:22px;left:15px;right:15px;
display:flex;justify-content:space-between;
align-items:end;
}

button{
width:75px;height:75px;border-radius:50%;
border:2px solid #ffffff88;
background:#102b40dd;
color:white;font-size:26px;
touch-action:none;
}

button:active{background:#00a9cc}

#title{
position:fixed;top:95px;left:15px;
font-size:23px;font-weight:bold;
color:#fff;text-shadow:0 2px 10px #000;
}

#start{
position:fixed;inset:0;
background:#06121ddd;
display:grid;place-items:center;
z-index:5;
}

.card{
background:#102b3e;
padding:30px;
border-radius:22px;
text-align:center;
color:white;
border:1px solid #00cfff;
}

#start button{
width:auto;height:auto;border-radius:12px;
padding:14px 35px;background:#00aeca;
font-size:17px;
}
</style>
</head>

<body>

<div id="hud">
 <div class="box">
  🚘 PRIDE 131
  <div style="color:#00eaff">HTM EDITION</div>
 </div>

 <div class="box" style="text-align:center">
  <div id="speed">0</div>
  KM/H
 </div>
</div>

<div id="title">PRIDE <span style="color:red">HTM</span></div>

<div id="controls">
 <div>
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>

 <div>
  <button id="brake">▼</button>
  <button id="gas">▲</button>
 </div>
</div>

<div id="start">
 <div class="card">
  <h1>🚘 PRIDE HTM 3D</h1>
  <p>آماده رانندگی هستی؟</p>
  <button id="play">شروع رانندگی</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">

import * as THREE from 'three';

/* SCENE */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x83bde8);
scene.fog=new THREE.Fog(0x83bde8,35,180);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,.1,500
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;

document.body.appendChild(renderer.domElement);

/* LIGHT */

scene.add(new THREE.HemisphereLight(0xffffff,0x52604a,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-20,35,-20);
sun.castShadow=true;
scene.add(sun);

/* MATERIALS */

const white=new THREE.MeshStandardMaterial({
color:0xe9edef,
metalness:.55,
roughness:.25
});

const black=new THREE.MeshStandardMaterial({
color:0x15191c,
roughness:.55
});

const glass=new THREE.MeshStandardMaterial({
color:0x15364b,
metalness:.5,
roughness:.15
});

const chrome=new THREE.MeshStandardMaterial({
color:0xc5cbd0,
metalness:.9,
roughness:.2
});

const red=new THREE.MeshStandardMaterial({
color:0xc90013,
emissive:0x330000
});

const lamp=new THREE.MeshStandardMaterial({
color:0xffffff,
emissive:0xffffff,
emissiveIntensity:2
});

/* GEOMETRY HELPER */

function box(parent,x,y,z,w,h,d,mat){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),mat
);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
parent.add(m);
return m;
}

/* CAR */

const car=new THREE.Group();
scene.add(car);

/* MAIN BODY */

box(car,0,.78,0,1.85,.72,4.25,white);

/* HOOD */

box(car,0,1.12,-1.48,1.78,.20,1.25,white);

/* TRUNK */

box(car,0,1.10,1.63,1.78,.25,.90,white);

/* ROOF */

box(car,0,1.76,.12,1.62,.18,1.75,white);

/* CABIN SIDES */

box(car,-.79,1.49,.12,.10,.60,1.85,white);
box(car,.79,1.49,.12,.10,.60,1.85,white);

/* WINDSHIELD */

const windshield=box(car,0,1.48,-.77,1.48,.48,.055,glass);
windshield.rotation.x=-.22;

/* REAR WINDOW */

const rearWindow=box(car,0,1.49,1.03,1.42,.45,.06,glass);
rearWindow.rotation.x=.20;

/* SIDE WINDOWS */

box(car,-.845,1.53,-.34,.025,.36,.76,glass);
box(car,-.845,1.53,.52,.025,.36,.64,glass);

box(car,.845,1.53,-.34,.025,.36,.76,glass);
box(car,.845,1.53,.52,.025,.36,.64,glass);

/* WINDOWS FRAMES */

box(car,-.86,1.77,.12,.035,.055,1.8,chrome);
box(car,.86,1.77,.12,.035,.055,1.8,chrome);

/* BUMPERS */

box(car,0,.55,-2.16,1.9,.30,.18,black);
box(car,0,.55,2.16,1.9,.30,.18,black);

/* FRONT GRILLE */

box(car,0,.88,-2.17,1.03,.36,.08,black);

/* GRILLE DETAILS */

for(let i=0;i<5;i++){
box(car,-.42+i*.21,.88,-2.22,.025,.28,.025,chrome);
}

/* FRONT LIGHTS */

for(let side of [-1,1]){
const head=box(car,side*.66,.98,-2.17,.42,.32,.10,lamp);

box(car,side*.68,.98,-2.23,.13,.23,.04,
new THREE.MeshStandardMaterial({
color:0xffe9a0,
emissive:0xffd36b,
emissiveIntensity:1
}));

/* FOG LIGHTS */

box(car,side*.68,.54,-2.28,.25,.12,.05,lamp);

/* MIRRORS */

box(car,side*.99,1.35,-.67,.25,.15,.23,black);

/* DOOR HANDLES */

box(car,side*.94,1.17,.05,.04,.07,.22,black);
box(car,side*.94,1.17,.86,.04,.07,.22,black);

/* TAIL LIGHTS */

box(car,side*.72,.95,2.15,.30,.34,.09,red);

}

/* PLATE */

box(car,0,.67,-2.27,.55,.17,.035,chrome);

/* SIDE HTM LABEL */

function label(text,x,y,z,rotation){
const canvas=document.createElement('canvas');
canvas.width=512;
canvas.height=128;

const c=canvas.getContext('2d');
c.fillStyle='#ffffff';
c.font='bold 95px Arial';
c.fillText(text,10,100);

const texture=new THREE.CanvasTexture(canvas);
const material=new THREE.MeshBasicMaterial({
map:texture,transparent:true
});

const mesh=new THREE.Mesh(
new THREE.PlaneGeometry(.55,.14),material
);

mesh.position.set(x,y,z);
mesh.rotation.y=rotation;
car.add(mesh);
}

label('HTM',-.96,1.08,-.1,-Math.PI/2);
label('HTM',.96,1.08,-.1,Math.PI/2);

/* WHEELS */

const wheels=[];

function makeWheel(x,z){

const wheel=new THREE.Group();
wheel.position.set(x,.49,z);
car.add(wheel);

const tire=new THREE.Mesh(
new THREE.CylinderGeometry(.39,.39,.22,32),
black
);

tire.rotation.z=Math.PI/2;
tire.castShadow=true;
wheel.add(tire);

const rim=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.25,.235,24),
chrome
);

rim.rotation.z=Math.PI/2;
wheel.add(rim);

for(let i=0;i<8;i++){
const a=i*Math.PI/4;

const spoke=box(
wheel,
Math.sin(a)*.12,
Math.cos(a)*.12,
0,
.055,.36,.035,
chrome
);

spoke.rotation.z=-a;
}

wheels.push(wheel);
}

for(let x of [-.96,.96]){
makeWheel(x,-1.35);
makeWheel(x,1.38);
}

/* ROAD */

const road=box(
scene,0,-.12,-70,
13,.2,220,
new THREE.MeshStandardMaterial({color:0x34383b})
);

/* ROAD EDGES */

for(let x of [-7,7]){
box(scene,x,.01,-70,.35,.2,220,
new THREE.MeshStandardMaterial({color:0xe9dfbd}));
}

/* ROAD MARKINGS */

const marks=[];

for(let i=0;i<30;i++){
const m=box(
scene,0,.015,-i*7,
.13,.025,3,
new THREE.MeshBasicMaterial({color:0xffffff})
);
marks.push(m);
}

/* GRASS */

box(scene,-28,-.25,-70,42,.1,220,
new THREE.MeshStandardMaterial({color:0x4d8952}));

box(scene,28,-.25,-70,42,.1,220,
new THREE.MeshStandardMaterial({color:0x4d8952}));

/* TREES */

const trees=[];

function makeTree(x,z){

const group=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.19,2,8),
new THREE.MeshStandardMaterial({color:0x65462e})
);

trunk.position.y=1;
group.add(trunk);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(1.25,3,9),
new THREE.MeshStandardMaterial({color:0x28653a})
);

leaves.position.y=3;
group.add(leaves);

group.position.set(x,0,z);
scene.add(group);
trees.push(group);
}

for(let i=0;i<35;i++){
makeTree(-12-Math.random()*8,-i*9);
makeTree(12+Math.random()*8,-i*9);
}

/* BUILDINGS */

const buildings=[];

for(let i=0;i<20;i++){

const b=new THREE.Mesh(
new THREE.BoxGeometry(
4+Math.random()*4,
7+Math.random()*15,
5+Math.random()*4
),
new THREE.MeshStandardMaterial({
color:new THREE.Color().setHSL(.55,.15,.35+Math.random()*.2)
})
);

b.position.set(
i%2?16:-16,
b.geometry.parameters.height/2-0.1,
-i*16
);

scene.add(b);
buildings.push(b);
}

/* CONTROLS */

let speed=0;
let steer=0;

const keys={
gas:false,
brake:false,
left:false,
right:false
};

function bind(id,key){

const el=document.getElementById(id);

el.addEventListener('pointerdown',e=>{
e.preventDefault();
keys[key]=true;
el.setPointerCapture(e.pointerId);
});

['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
el.addEventListener(ev,()=>keys[key]=false);
});
}

bind('gas','gas');
bind('brake','brake');
bind('left','left');
bind('right','right');

addEventListener('keydown',e=>{
if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;
if(e.key==='ArrowDown'||e.key==='s')keys.brake=true;
if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
});

addEventListener('keyup',e=>{
if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;
if(e.key==='ArrowDown'||e.key==='s')keys.brake=false;
if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
});

/* GAME */

let started=false;

document.getElementById('play').onclick=()=>{
started=true;
document.getElementById('start').style.display='none';
};

const clock=new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.04);

if(started){

if(keys.gas)speed+=35*dt;
else speed-=8*dt;

if(keys.brake)speed-=65*dt;

speed=THREE.MathUtils.clamp(speed,0,180);

let direction=0;

if(keys.left)direction=-1;
if(keys.right)direction=1;

steer+=(direction-steer)*5*dt;

car.position.x+=steer*speed*.012*dt*60;

car.position.x=THREE.MathUtils.clamp(car.position.x,-4.3,4.3);

car.position.z-=speed*.045*dt*60;

wheels.forEach(w=>{
w.rotation.x-=speed*.012*dt;
});

// Infinite road markings

marks.forEach(m=>{
if(m.position.z>car.position.z+8){
m.position.z-=210;
}
});

// Infinite trees

trees.forEach(t=>{
if(t.position.z>car.position.z+15){
t.position.z-=315;
}
});

// Infinite buildings

buildings.forEach(b=>{
if(b.position.z>car.position.z+25){
b.position.z-=320;
}
});

document.getElementById('speed').textContent=
Math.round(speed).toLocaleString('fa-IR');

}

/* CAMERA */

const target=new THREE.Vector3(
car.position.x*.6,
4.5,
car.position.z+9
);

camera.position.lerp(target,.07);

camera.lookAt(
car.position.x,
1,
car.position.z-3
);

renderer.render(scene,camera);

}

animate();

/* RESIZE */

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
 </html>
